
name: Market Intelligence Email Alerts

on:
  schedule:
    - cron: "*/15 * * * 1-5"

  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test email only"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: market-alert-state
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check stocks and send email
        id: alerts
        continue-on-error: true
        env:
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          SEND_TEST_EMAIL: ${{ inputs.test_email && 'true' || 'false' }}
        run: python alert_worker.py

      - name: Commit alert state
        if: ${{ inputs.test_email != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add alert_state.json

          if ! git diff --cached --quiet; then
            git commit -m "Save alert state [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Fail if email or monitoring failed
        if: ${{ steps.alerts.outcome == 'failure' }}
        run: exit 1
